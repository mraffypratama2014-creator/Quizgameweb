<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Ultimate Quiz 🎮</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #0f0f1b);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .game-card {
            background: #2a2a40;
            width: 100%;
            max-width: 550px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #3d3d5c;
        }

        h1 {
            color: #00ffcc;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .subtitle {
            color: #a0a0c0;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: bold;
            text-align: left;
            margin: 15px 0 8px 0;
            color: #ffcc00;
        }

        .mode-grid, .diff-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .card-btn {
            background: #363654;
            border: 2px solid #4a4a70;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .card-btn:hover {
            background: #4a4a70;
            transform: translateY(-2px);
        }

        .card-btn.selected {
            border-color: #00ffcc;
            background: #00ffcc22;
            color: #00ffcc;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #1e1e2f;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #3d3d5c;
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .opt-btn {
            background: #363654;
            border: 2px solid #4a4a70;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .opt-btn:hover {
            background: #4a4a70;
        }

        .btn-action {
            background: linear-gradient(90deg, #00ffcc, #0099ff);
            color: #0f0f1b;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .correct {
            background: #28a745 !important;
            border-color: #28a745 !important;
            color: white;
        }

        .wrong {
            background: #dc3545 !important;
            border-color: #dc3545 !important;
            color: white;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="game-card">

    <!-- 1. BERANDA -->
    <div id="home-screen">
        <h1>Gamer Master 🎮</h1>
        <p class="subtitle">Uji pengetahuan gamer sejati dari Easy hingga Impossible!</p>

        <div class="section-title">1. Pilih Game:</div>
        <div class="mode-grid">
            <button class="card-btn selected" onclick="selectMode('roblox', this)">🔴 Roblox</button>
            <button class="card-btn" onclick="selectMode('minecraft', this)">🟩 Minecraft</button>
            <button class="card-btn" onclick="selectMode('ff', this)">🔥 Free Fire</button>
            <button class="card-btn" onclick="selectMode('ml', this)">⚔️ Mobile Legends</button>
        </div>

        <div class="section-title">2. Pilih Tingkat Kesulitan:</div>
        <div class="diff-grid">
            <button class="card-btn selected" onclick="selectDiff('easy', this)">🟢 Easy</button>
            <button class="card-btn" onclick="selectDiff('medium', this)">🟡 Medium</button>
            <button class="card-btn" onclick="selectDiff('hard', this)">🔴 Hard</button>
            <button class="card-btn" onclick="selectDiff('impossible', this)">💀 Impossible</button>
        </div>

        <button class="btn-action" onclick="startGame()">Mulai Permainan 🚀</button>
    </div>

    <!-- 2. LAYAR PERMAINAN -->
    <div id="game-screen" class="hidden">
        <div class="stats-bar">
            <span>Soal: <span id="question-num">1</span>/<span id="total-q">10</span></span>
            <span style="color:#00ffcc">Skor: <span id="score">0</span></span>
        </div>

        <div class="question-box" id="question-text">
            Pertanyaan...
        </div>

        <div class="options-grid" id="options-container">
            <!-- Pilihan jawaban -->
        </div>
    </div>

    <!-- 3. LAYAR HASIL -->
    <div id="end-screen" class="hidden">
        <h2>Permainan Selesai! 🎉</h2>
        <p class="subtitle">Mode: <span id="res-mode" style="color:#00ffcc"></span> | Difficulty: <span id="res-diff" style="color:#ffcc00"></span></p>
        <h1 style="font-size: 3rem; color: #00ffcc;" id="final-score">0</h1>
        <p id="rank-text" style="font-weight: bold; font-size: 1.1rem;"></p>
        <button class="btn-action" onclick="goHome()">Kembali ke Beranda 🏠</button>
    </div>

</div>

                { question: "Senjata Sniper paling mematikan yang biasa didapatkan dari Airdrop adalah...", options: ["Kar98k", "M82B", "AWM", "SVD"], answer: 2 },
                { question: "Fitur yang memberikan perlindungan rompi dari ledakan helm & armor adalah...", options: ["Vest Enforcer", "Vest Thickener / Vest Level 4", "Armor Shield", "Helme Protector"], answer: 1 },

            ],
            hard: [

            impossible: [
                { question: "Berapa damage maksimal senjata AWM saat mengenai kepala (Headshot) tanpa helm?", options: ["300", "1100", "9999", "500"], answer: 1 },

    // STATE GAME
    let selectedGameMode = 'roblox';
    let selectedDifficulty = 'easy';
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    function selectMode(mode, element) {
        selectedGameMode = mode;
        document.querySelectorAll('.mode-grid .card-btn').forEach(btn => btn.classList.remove('selected'));
        element.classList.add('selected');
    }

    function selectDiff(diff, element) {
        selectedDifficulty = diff;
        document.querySelectorAll('.diff-grid .card-btn').forEach(btn => btn.classList.remove('selected'));
        element.classList.add('selected');
    }

    function startGame() {
        currentQuestions = questionBank[selectedGameMode][selectedDifficulty];
        currentQuestionIndex = 0;
        score = 0;

        document.getElementById("total-q").innerText = currentQuestions.length;
        document.getElementById("home-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");

        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentQuestionIndex];
        document.getElementById("question-num").innerText = currentQuestionIndex + 1;
        document.getElementById("score").innerText = score;
        document.getElementById("question-text").innerText = q.question;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.className = "opt-btn";
            btn.innerText = option;
            btn.onclick = () => selectAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex, btnElement) {
        const q = currentQuestions[currentQuestionIndex];
        const buttons = document.querySelectorAll("#options-container .opt-btn");

        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.answer) {
            btnElement.classList.add("correct");
            score += 20;
        } else {
            btnElement.classList.add("wrong");
            buttons[q.answer].classList.add("correct");
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                endGame();
            }
        }, 1200);
    }

    function endGame() {
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.remove("hidden");

        document.getElementById("res-mode").innerText = selectedGameMode.toUpperCase();
        document.getElementById("res-diff").innerText = selectedDifficulty.toUpperCase();
        document.getElementById("final-score").innerText = score + " PTS";

        let maxScore = currentQuestions.length * 20;
        let percentage = (score / maxScore) * 100;

        let rank = "";
        if (percentage === 100) {
            rank = "🏆 Title: GOD HAND GAMER (Perfect!)";
        } else if (percentage >= 70) {
            rank = "⭐ Title: PRO GAMER!";
        } else if (percentage >= 40) {
            rank = "🛡️ Title: PLAYER CASUAL";
        } else {
            rank = "🧱 Title: NOOB GAMER, COBA LAGI!";
        }
        document.getElementById("rank-text").innerText = rank;
    }

    function goHome() {
        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("home-screen").classList.remove("hidden");
    }
